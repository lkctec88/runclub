services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: runclub
      POSTGRES_USER: runclub
      POSTGRES_PASSWORD: runclub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runclub -d runclub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=runclub;Username=runclub;Password=runclub"
      Jwt__Key: "RunClubDevSuperSecretKey_ChangeMe_32chars!"
      Cors__Origins__0: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
